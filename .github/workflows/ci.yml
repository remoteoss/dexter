name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly run of the same integration job against the newest stable Elixir and
  # OTP. The BEAM readers decode whatever the current toolchain produces, so a
  # format change has to be caught by a schedule rather than by a user report.
  # Scheduled only: no pull request waits on a toolchain nobody has installed.
  schedule:
    - cron: "24 3 * * 1"

permissions:
  contents: read

env:
  CGO_ENABLED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...

  test-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  test-integration:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/integration.yml
    with:
      image: elixir:1.20.4-otp-29
      cache-suffix: otp-29

  integration-next:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/integration.yml
    with:
      image: elixir:latest
      cache-suffix: latest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
      - run: make lint
